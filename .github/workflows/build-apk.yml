name: Build MochiDuo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Prepare MochiDuo.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk MochiDuo.apk

      - name: Upload MochiDuo.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiDuo-APK
          path: MochiDuo.apk

      - name: Publish MochiDuo.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MochiDuo.apk \
            --title "MochiDuo $TAG" \
            --notes "Build otomatis APK Android MochiDuo. Download file MochiDuo.apk di bawah lalu install langsung di HP Android." \
            --latest
